<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASCII Studio</title>
<!-- Dev only (localhost:5173/ascii-studio.html). Not part of the live site:
     the build only includes index.html. Scenes: src/studio/scenes.ts.
     "Final" saves to src/ascii/final.json (the app uses those values). -->
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('/src/assets/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-weight: 400; }
  :root { --bg: #000; --panel: #070707; --text: #e6e6e6; --muted: #7c7c7c; --line: #262626; --line2: #3a3a3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.4 'JetBrains Mono', Consolas, 'Courier New', monospace; }
  body { display: grid; grid-template-columns: 170px 1fr 300px; height: 100vh; }
  nav, aside { background: var(--panel); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  nav { border-right: 1px solid var(--line); }
  aside { border-left: 1px solid var(--line); gap: 10px; }
  nav button { text-align: left; }
  .title { color: var(--muted); font-size: 11px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #where { color: var(--muted); }
  #holder { flex: 1; position: relative; overflow: hidden; }
  #frame { position: absolute; outline: 1px solid var(--line2); overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000;
    font-family: 'JetBrains Mono', Consolas, monospace; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .mock-form { position: absolute; left: 50%; top: 50%; width: 340px; height: 380px; transform: translate(-50%, -50%);
    border: 1px dashed #333; color: #444; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #note { color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); }
  button, select, input[type=text] { background: transparent; color: var(--text); border: 1px solid var(--line2);
    padding: 3px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: #777; }
  button.on { background: var(--text); color: #000; }
  button.final { border-color: #e6e6e6; }
  select option { background: #000; }
  input[type=range] { width: 100%; accent-color: #ddd; }
  input[type=color] { background: transparent; border: 1px solid var(--line2); width: 44px; height: 22px; padding: 0; }
  .knob { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; border-bottom: 1px solid #111; }
  .knob .head { display: flex; justify-content: space-between; gap: 6px; }
  .knob .val { color: var(--text); }
  .knob .val.changed::after { content: ' •'; color: #e6e6e6; }
  .knob .hint { color: var(--muted); font-size: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  #status { color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<nav>
  <div class="title">scenes</div>
  <div id="scenes" style="display:flex;flex-direction:column;gap:4px"></div>
  <div class="title" style="margin-top:12px">new animation?</div>
  <div class="title" style="color:#555">describe it to Claude in the chat — it appears here.</div>
</nav>

<main>
  <div id="bar">
    <b id="sceneName"></b>
    <span id="where"></span>
    <span style="flex:1"></span>
    <span id="actions" class="row"></span>
    <label class="title">screen
      <select id="screen">
        <option value="1536x730">1536 × 730 (laptop browser)</option>
        <option value="1920x1080">1920 × 1080 (Full HD)</option>
        <option value="1366x650">1366 × 650 (small laptop)</option>
        <option value="390x844">390 × 844 (phone)</option>
        <option value="fit">fit this panel</option>
      </select>
    </label>
  </div>
  <div id="holder"><div id="frame"><div id="stage"><canvas id="cv"></canvas></div></div></div>
  <div id="note"></div>
</main>

<aside>
  <div class="row">
    <span class="title">compare</span>
    <button id="slotA" class="on">A</button>
    <button id="slotB">B</button>
    <button id="copyAB" title="copy the shown version into the other slot">copy to other</button>
  </div>
  <div class="row">
    <button id="final" class="final" title="save the shown version into src/ascii/final.json">Final ✓</button>
    <button id="reset" title="back to the saved final values">reset</button>
    <button id="copy" title="copy values as JSON">copy values</button>
  </div>
  <div id="status"></div>
  <div class="title">settings (• = changed from final)</div>
  <div id="knobs" style="display:flex;flex-direction:column;gap:6px"></div>
</aside>

<script type="module" src="/src/studio/main.ts"></script>
</body>
</html>
